<script>
  (function() {
    // ==================== CONFIGURATION ====================
    const MAX_ATTEMPTS = 5;
    const GAME_DURATION = 180; // secondes (3 minutes)
    const SECRET_KEY = "HAITI1805";
    const WHATSAPP_NUMBER = "509XXXXXXXX"; // ← Remplacez par le vrai numéro
    const EVENT_END_DATE = new Date('2026-05-18T23:59:59-05:00'); // Heure Haïti

    // ==================== FONCTIONS DE STOCKAGE SÉCURISÉ ====================
    function simpleHash(str) {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 33) ^ str.charCodeAt(i);
      }
      return (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
    }
    function shortHash(str, len = 4) {
      return simpleHash(str).slice(0, len);
    }
    function secureSet(key, valueObj) {
      const json = JSON.stringify(valueObj);
      const checksum = simpleHash(json + SECRET_KEY);
      const payload = { d: json, h: checksum };
      localStorage.setItem(key, btoa(JSON.stringify(payload)));
    }
    function secureGet(key) {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      try {
        const payload = JSON.parse(atob(raw));
        const expected = simpleHash(payload.d + SECRET_KEY);
        if (payload.h !== expected) {
          localStorage.removeItem(key);
          return null;
        }
        return JSON.parse(payload.d);
      } catch (e) {
        localStorage.removeItem(key);
        return null;
      }
    }
    function getAttempts() {
      const data = secureGet('jwennDrapoAttempts');
      return data ? data.count : 0;
    }
    function setAttempts(count) {
      secureSet('jwennDrapoAttempts', { count });
    }
    function incrementAttempts() {
      let count = getAttempts();
      if (count >= MAX_ATTEMPTS) return false;
      count++;
      setAttempts(count);
      return true;
    }
    function isGameLocked() {
      return getAttempts() >= MAX_ATTEMPTS;
    }

    // ==================== COMPTE À REBOURS ====================
    function updateCountdown() {
      const now = new Date();
      const diff = EVENT_END_DATE - now;
      if (diff <= 0) {
        document.getElementById('cd-days').textContent = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent = '00';
        document.getElementById('cd-secs').textContent = '00';
        return;
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      document.getElementById('cd-days').textContent = String(days).padStart(2,'0');
      document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
      document.getElementById('cd-mins').textContent = String(mins).padStart(2,'0');
      document.getElementById('cd-secs').textContent = String(secs).padStart(2,'0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ==================== FAKE LEADERBOARD ====================
    function buildFakeLeaderboard() {
      const names = [
        "Jean R.", "Michaëlle C.", "Pierre L.", "Magalie T.", "Frantz D.",
        "Rose M.", "Ricardo A.", "Sophie P.", "Davidson F.", "Nathalie B.",
        "Marc K.", "Claudine J.", "Emmanuel S.", "Fabienne G.", "Steeve R.",
        "Chantal V.", "Kensley H.", "Wildine E.", "Marc-Andy Z.", "Youseline O."
      ];
      const list = document.getElementById('leader-list');
      let html = '';
      for (let i = 1; i <= 200; i++) {
        const name = names[Math.floor(Math.random() * names.length)] + (i%10);
        const games = Math.floor(Math.random() * 5) + 1;
        const won = (i <= 3) ? true : false; // 3 faux gagnants
        if (won) {
          html += `<div class="leader-item winner">🏆 ${name} – ${games} parties – <b>GAGNÉ</b></div>`;
        } else {
          html += `<div class="leader-item">😞 ${name} – ${games} parties – perdu</div>`;
        }
      }
      list.innerHTML = html;
    }
    buildFakeLeaderboard();

    // ==================== POPUNDER (max 5) ====================
    let popunderCount = 0;
    function triggerPopunder() {
      if (popunderCount >= 5) return;
      popunderCount++;
      const script = document.createElement('script');
      script.src = "https://penguinsincequalify.com/13/4b/19/134b1970caa33d9d8228aebf165e4d10.js";
      document.body.appendChild(script);
    }

    // ==================== JEU ====================
    const GRID_SIZE = 25;
    const CELL_SIZE = 80;
    const TREES = ['🌲','🌳','🌿','🍃','🌱','🌴','🎋','🍀','🌵','🍂'];
    const NEON_COLORS = [
      '#39ff14', '#ff44cc', '#00d4ff', '#ff3131', '#ffd700', '#bc13fe'
    ];

    let currentAttempt = 0;
    let gameTimerInterval = null;
    let gameTimeout = null; // pour fin automatique
    let startTime = null;
    let remainingSeconds = GAME_DURATION;

    function showScreen(screenId) {
      document.querySelectorAll('#home-screen, #game-screen, #defeat-card, #gameover-screen')
        .forEach(el => el.classList.add('hidden'));
      if (screenId) document.getElementById(screenId).classList.remove('hidden');
    }

    function generateGrid() {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'tree-cell';
        cell.textContent = TREES[Math.floor(Math.random() * TREES.length)];
        cell.style.color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
        cell.style.fontSize = (28 + Math.random() * 20) + 'px';
        cell.style.animationDelay = Math.random() * 2 + 's';
        grid.appendChild(cell);
      }
      // Pas de drapeau – personne ne gagne
    }

    function startGame() {
      if (isGameLocked()) {
        showScreen('gameover-screen');
        return;
      }
      const incremented = incrementAttempts();
      if (!incremented) {
        showScreen('gameover-screen');
        return;
      }
      currentAttempt = getAttempts();
      generateGrid();
      startTime = Date.now();
      remainingSeconds = GAME_DURATION;
      updateTimerDisplay();
      gameTimerInterval = setInterval(updateTimerDisplay, 1000);
      // Fin automatique après GAME_DURATION secondes
      gameTimeout = setTimeout(() => {
        abandonGame(true); // true pour indiquer temps écoulé
      }, GAME_DURATION * 1000);
      showScreen('game-screen');
      document.getElementById('game-area').scrollTo(0, 0);
    }

    function updateTimerDisplay() {
      if (!startTime) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      remainingSeconds = Math.max(0, GAME_DURATION - elapsed);
      const mins = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
      const secs = (remainingSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
    }

    function stopTimers() {
      if (gameTimerInterval) {
        clearInterval(gameTimerInterval);
        gameTimerInterval = null;
      }
      if (gameTimeout) {
        clearTimeout(gameTimeout);
        gameTimeout = null;
      }
    }

    function abandonGame(timeUp = false) {
      stopTimers();
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      // Points fictifs basés sur le temps (plus c'est court, plus de points ? ou aléatoire)
      const points = timeUp ? 
        Math.floor(Math.random() * 300) + 50 : 
        Math.floor(Math.random() * 500) + 100;
      document.getElementById('defeat-time').textContent = elapsed + ' secondes';
      document.getElementById('defeat-points').textContent = points;

      // Historique local
      let history = secureGet('jwennDrapoHistory');
      if (!history) history = [];
      history.push({ attempt: currentAttempt, time: elapsed, points });
      secureSet('jwennDrapoHistory', history);

      // Déclencher popunder
      triggerPopunder();

      showScreen('defeat-card');
    }

    // ==================== ÉVÉNEMENTS ====================
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('abandon-btn').addEventListener('click', () => abandonGame(false));

    document.getElementById('retry-btn').addEventListener('click', function() {
      if (isGameLocked()) {
        showScreen('gameover-screen');
        return;
      }
      startGame();
    });

    // Partage WhatsApp (défaite)
    document.getElementById('share-defeat-btn').addEventListener('click', function() {
      const text = encodeURIComponent("🇭🇹 Je viens de perdre au jeu Jwenn Drapo a ! Peux-tu trouver le drapeau et gagner 10 000 HTG ? Joue ici : https://TON-UTILISATEUR.github.io/jwenn-drapo-a/");
      window.open(`https://wa.me/?text=${text}`, '_blank');
    });

    // Initialisation
    if (isGameLocked()) {
      showScreen('gameover-screen');
    } else {
      showScreen('home-screen');
    }
  })();
</script>
